name: Focus
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # personal (free) team
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Focus:
    type: application
    platform: iOS
    sources: [Focus]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Focus/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Focus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focus
